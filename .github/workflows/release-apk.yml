# Builds a release APK and attaches it to a GitHub Release: either
# automatically on a vX.Y.Z tag push, or on-demand via workflow_dispatch
# (Actions tab -> Release APK -> Run workflow), which creates the tag too -
# handy since tag pushes from outside GitHub's own infrastructure can be
# blocked by branch/tag protection rules.
#
# Signing: release builds use a fixed, checked-in keystore
# (android/redl-release.keystore, referenced from build.gradle.kts) rather
# than the platform's default debug keystore, which GitHub Actions
# regenerates randomly on every fresh runner - without a fixed key, each
# release would be signed differently and Android would refuse to install
# it as an update over the previous one. This is a sideloadable POC key,
# not a production Play Store upload key.
#
# API URL: baked in at build time via --dart-define (see PROD_API_URL below)
# - release builds always point at the production backend, not the
# emulator-only default used by plain `flutter run`.
name: Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  # The API_BASE_URL baked into release builds - REDL's production backend.
  # Override with a different value if this ever needs to point elsewhere.
  PROD_API_URL: https://redl.besse.dev/api

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ env.PROD_API_URL }} \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/redl-${{ steps.version.outputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/redl-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
