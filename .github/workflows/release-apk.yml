# Builds a release APK and attaches it to a GitHub Release: either
# automatically on a vX.Y.Z tag push, or on-demand via workflow_dispatch
# (Actions tab -> Release APK -> Run workflow), which creates the tag too -
# handy since tag pushes from outside GitHub's own infrastructure can be
# blocked by branch/tag protection rules.
#
# Signing: the app's default Flutter scaffold signs release builds with the
# debug keystore (see android/app/build.gradle.kts), so this produces a
# sideloadable APK with no keystore secrets required. That's fine for
# POC/internal distribution; a real Play Store release would need a proper
# upload keystore configured as CI secrets.
#
# API URL: baked in at build time via --dart-define (see PROD_API_URL below)
# - release builds always point at the production backend, not the
# emulator-only default used by plain `flutter run`.
name: Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  # The API_BASE_URL baked into release builds - REDL's production backend.
  # Override with a different value if this ever needs to point elsewhere.
  PROD_API_URL: https://redl.besse.dev/api

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ env.PROD_API_URL }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/redl-${{ steps.version.outputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/redl-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
