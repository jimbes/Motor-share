# Builds a release APK and attaches it to a GitHub Release whenever a
# vX.Y.Z tag is pushed (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Can also be run manually from the Actions tab (workflow_dispatch) - in
# that case the APK is uploaded as a build artifact instead of a release.
#
# Signing: the app's default Flutter scaffold signs release builds with the
# debug keystore (see android/app/build.gradle.kts), so this produces a
# sideloadable APK with no keystore secrets required. That's fine for
# POC/internal distribution; a real Play Store release would need a proper
# upload keystore configured as CI secrets.
name: Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p ../dist
          version="${GITHUB_REF_NAME:-manual-$(date +%Y%m%d%H%M%S)}"
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/redl-${version}.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/redl-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: redl-apk
          path: dist/redl-*.apk
