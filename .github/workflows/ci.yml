# Analyzes, tests, and builds a debug APK on every push to main - a debug
# build needs no signing keystore, but still compiles the full Android
# project (native/Kotlin code included, e.g. the Android Auto
# CarAppService integration), so a compile error there is caught here
# instead of only being discovered on-device.
#
# Once that's green, the tag-release job auto-bumps the patch version
# (vX.Y.Z -> vX.Y.Z+1, per the latest git tag) and dispatches
# release-apk.yml's workflow_dispatch trigger with it - reusing the exact
# same path as running it by hand, rather than pushing the tag ourselves:
# a push made with the default GITHUB_TOKEN does NOT fire other workflows'
# `on: push` triggers (a deliberate GitHub anti-recursion rule), so
# release-apk.yml's tag-push trigger would silently never fire for it. An
# explicit workflow_dispatch call sidesteps that rule entirely, and
# release-apk.yml already creates the tag itself in that mode. A
# minor/major bump is still manual: trigger release-apk.yml by hand
# (Actions tab -> Release APK -> Run workflow) with the desired version
# when one's warranted.
name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

  tag-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine the next patch version
        id: version
        run: |
          latest=$(git tag --list 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            new_tag="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Latest tag: ${latest:-none} -> new tag: $new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch the Release APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-apk.yml --ref main -f version=${{ steps.version.outputs.tag }}
