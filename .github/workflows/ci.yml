# Analyzes, tests, and builds a debug APK on every push to the tracked
# branch - a debug build needs no signing keystore, but still compiles the
# full Android project (native/Kotlin code included, e.g. the Android Auto
# CarAppService integration), so a compile error there is caught here
# instead of only being discovered on-device.
name: CI

on:
  push:
    branches:
      - claude/motorbike-tracking-app-lsc7lq

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
